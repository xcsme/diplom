services:
  # ── Frontend (React → nginx) ──
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:80"

  # ── Backend (FastAPI) ──
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      - MONGO_URL=mongodb://mongo:27017
      - DB_NAME=coffeeshop_game
      - CORS_ORIGINS=*
    ports:
      - "8001:8001"

  # ── MongoDB ──
  mongo:
    image: mongo:7
    restart: unless-stopped
    healthcheck:
      test: mongosh --eval "db.adminCommand('ping')" --quiet 2>&1
      start_period: 40s
      interval: 15s
      timeout: 10s
      retries: 10
