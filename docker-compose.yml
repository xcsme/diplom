version: "3.8"

services:
  # ── MongoDB ──
  mongo:
    image: mongo:7
    container_name: coffeeshop-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    healthcheck:
      test: mongosh --eval "db.adminCommand('ping')" --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Backend (FastAPI) ──
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: coffeeshop-backend
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      - MONGO_URL=mongodb://mongo:27017
      - DB_NAME=coffeeshop_game
      - CORS_ORIGINS=*
    ports:
      - "8001:8001"

  # ── Frontend (React → nginx) ──
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: coffeeshop-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
